<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalChat</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="join-screen" class="screen">
      <form id="usernameForm" class="join-card">
        <h1>LocalChat</h1>
        <p class="subtitle">Sem cadastro — só um nome pra entrar.</p>
        <input
          id="input-username"
          autocomplete="off"
          placeholder="Seu nome"
          required
        />
        <button type="submit">Entrar</button>
      </form>
    </div>

    <div id="chat-screen" class="screen" hidden>
      <aside id="sidebar">
        <h2>LocalChat</h2>
        <p class="online-count"><span id="online-count">0</span> online</p>
        <ul id="online-list"></ul>
      </aside>

      <main id="chat-main">
        <ul id="messages"></ul>

        <form id="form">
          <input id="input" autocomplete="off" placeholder="Digite uma mensagem" />
          <button type="submit">Enviar</button>
        </form>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
